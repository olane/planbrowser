name: Build Electron releases

# Build and publish desktop installers when a version tag (v*) is pushed, or
# on demand. macOS targets Sequoia (15) onwards on Apple Silicon; Windows and
# Linux build x64. Each OS builds on its own runner (electron-builder cannot
# cross-compile), uploads its installers, and a final job collects them into a
# single GitHub Release.
#
# Note: builds are unsigned. macOS artifacts will show a Gatekeeper warning
# ("cannot be opened") until the user opts in via right-click > Open; Windows
# artifacts trigger SmartScreen.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Electron app reuses its own Chromium for scraping, so we never need to
  # download a Playwright browser here.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # No code-signing certificates in CI; don't attempt discovery.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build backend and UI
        run: npm run build && npm run build --prefix ui

      - name: Build installers
        run: npx electron-builder

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
